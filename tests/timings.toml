# Measured wall-clock per test target, in milliseconds.
#
# Written by `inillucent-testrun --record`, and read back to schedule the
# longest targets first. It is committed because the schedule has to be
# good on the first run on a fresh clone, not on the second.
#
# These are times under the parallel runner on a 24-core machine, so they
# are longer than the same suite's time to itself. That is the right
# number for ordering: it is what the suite costs the run it is part of.

