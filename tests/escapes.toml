# The escape ledger: every defect that reached a user, and the test that holds it now.
#
# Read by `crates/inillucent-compat/tests/escapes.rs`, which fails when a
# `held_by` entry names a test that does not exist, when a row holds nothing and
# does not say why, and when an escape named in
# `tests/inillucent-e2e-scenarios-tdd.md` §3.2 has no row here at all.
#
# ## Why a file rather than a paragraph
#
# Because "we added a test for that" is a claim, and a claim in prose cannot
# fail a build. Every serious defect in this repository's history was found by a
# real use the suite did not model, and after each one somebody wrote a test and
# said so in a commit message. Nothing checked that the test still existed, that
# it still ran, or that it was the test the message named. This file is that
# check: a row per escape, the test that holds it, and a guard that resolves
# every name.
#
# ## The fields
#
# `ref`      the commit, ticket or release the escape belongs to
# `surface`  where it lives, in this repository's own words
# `what`     one sentence: what a user saw
# `found_by` how it was found, which is the thing the suite was not doing
# `held_by`  the tests that now fail if it comes back, as
#            `<package>::<target>::<test>`; a scenario is
#            `<package>::<target>::<story>::<arm>`
# `open`     required when `held_by` is empty, and forbidden when it is not:
#            why nothing holds this yet
#
# ## Adding a row
#
# A ticket that fixes a defect adds its row in the same commit as the fix. That
# is the documentation rule; `escapes.rs` is what makes it more than a rule.
# When a ticket closes an `open` row, the `open` line goes and `held_by` names
# the test - the guard refuses a row that carries both.

