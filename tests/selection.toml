# Which tests a change has to run.
#
# Read by `inillucent_compat::selection`, driven by `inillucent-testrun`, and
# kept honest by `crates/inillucent-compat/tests/selection.rs`, which fails when
# a target in the workspace has no row here or a row here names a target that
# does not exist. The gold standard this file serves is
# `tests/inillucent-testing-tdd.md`.
#
# ## The three fields that matter
#
# `tier` is a band you can ask for by name. Every target is in exactly one, so
# the tiers partition the suite rather than overlapping it - `--tier engine`
# and `--tier differential` together are what they sound like.
#
# `covers` is the **top** of the stack a suite drives, not everything under it.
# Selection closes upward over reverse dependencies first, so a suite that runs
# the shell declares `inillucent-cli` and is selected by a change to the page
# pool, because the pool is underneath the shell. Writing out the whole stack
# would be writing out something the graph already knows, and it would go stale
# the first time an edge moved.
#
# `covers` is omitted where it would only repeat the row's own package, which is
# the case for every crate that holds its own tests. It is spelled out for
# `inillucent-compat`, which sits above the entire engine: a rule that read the
# owning package out of the closure would select all 74 of its suites for every
# change, and a selector that always selects everything is not one.
#
# `requires` names what a suite needs that this workspace cannot build. Each of
# those suites reports success when its prerequisite is absent - correct for a
# fresh clone, and a trap for anybody reading the green as evidence - so the
# runner counts them, names them, and fails under `--strict`.


[[tier]]
name = "smoke"
purpose = "the ten-second answer: a real file opened, written, reopened, read"

[[tier]]
name = "unit"
purpose = "every crate's own #[cfg(test)] modules"

[[tier]]
name = "engine"
purpose = "SQL and storage behaviour over real database files"

[[tier]]
name = "differential"
purpose = "graded against the pinned SQLite 3.53.4"

[[tier]]
name = "durability"
purpose = "crashes, injected faults, corruption and concurrency"

[[tier]]
name = "e2e"
purpose = "the public surfaces an application binds to, end to end"

[[tier]]
name = "perf"
purpose = "the cost guards, so a regression fails a test rather than a benchmark"
exclusive = true

[[tier]]
name = "retrieval"
purpose = "the embedding and retrieval engine, and its graded harness"

[[tier]]
name = "tooling"
purpose = "the checks that keep the repository's own rules true"

# ---------------------------------------------------------------------------
# What a change outside every crate selects.
#
# A path matching none of these selects EVERYTHING, and says which path did
# it. That is the safe direction: a new top-level directory should make a run
# loud rather than silently test nothing.
# ---------------------------------------------------------------------------

[[path]]
prefix = "Cargo.toml"
packages = ["*"]
reason = "the workspace manifest decides what every crate resolves to"

[[path]]
prefix = "Cargo.lock"
packages = ["*"]
reason = "a version moved under every crate at once"

[[path]]
prefix = "compat/"
packages = ["*"]
reason = "the pinned manifest, the source register and the fixtures every differential suite reads"

[[path]]
prefix = "tests/"
packages = ["*"]
reason = "the shared corpora, schedules and this map itself; a change here can move any suite"

[[path]]
prefix = "tools/"
packages = ["*"]
reason = "the reference build and the feature probe, which decide what the suites are graded against"

[[path]]
prefix = "docs/"
packages = []
reason = "the documentation; prose, and nothing compiles from it. The two contract files below have their own rows, and a longer prefix wins"

[[path]]
prefix = "docs/invariants/"
packages = ["inillucent-compat"]
reason = "the layering contract and the invariant register, which only `policy` and `harness` read"

[[path]]
prefix = "docs/dependency-policy.md"
packages = ["inillucent-compat"]
reason = "the dependency contract `policy` enforces"

# Prose for an agent to read, and nothing compiles from it - so a change here
# should select nothing rather than the whole suite, which is what an unmatched
# top-level directory would do.
[[path]]
prefix = "agent-skills/"
packages = []
reason = "task-shaped instructions for an agent; no code reads them"

[[path]]
prefix = "AGENTS.md"
packages = []
reason = "the agent front door; prose, and no code reads it"

[[path]]
prefix = ".sqlite-ref/"
packages = ["*"]
reason = "the pinned reference binaries themselves"

[[path]]
prefix = "scripts/"
packages = ["inillucent-bench"]
reason = "corpus fetchers, used only by the grading harness"

[[path]]
prefix = "fuzz/"
packages = []
reason = "the fuzz targets are built and run on their own, never by the suite"

[[path]]
prefix = "_agent_output/"
packages = []
reason = "scratch and evidence, gitignored, read by nothing"

[[path]]
prefix = "_junk/"
packages = []
reason = "scratch, read by nothing"

# The Unluminous IDE's per-workspace state - which files are open, which folders
# are expanded. It is gitignored and nothing compiles from it, and without a rule
# here it matched nothing and therefore selected every suite in the workspace.
[[path]]
prefix = ".unluminous/"
packages = []
reason = "the editor's own workspace state; no code reads it"

[[path]]
prefix = "target/"
packages = []
reason = "build output"

[[path]]
prefix = "README.md"
packages = []
reason = "prose"

[[path]]
prefix = "inillucent-scorecard.md"
packages = []
reason = "prose"

[[path]]
prefix = "inillucent-scorecard.json"
packages = []
reason = "the scorecard's own record of a run"

[[path]]
prefix = "tasks/"
packages = []
reason = "design documents"

[[path]]
prefix = ".gitignore"
packages = []
reason = "nothing is compiled from it"

