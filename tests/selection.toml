# **In the engine tier although its name says differential**, because it
# compares this engine with itself: a predicate's three partitions against the
# whole table, and the same predicate through an index against through a scan.
# The differential tier's rule is that every suite in it declares the pinned
# reference as a prerequisite, so that a run without the oracle built cannot
# look like a pass - and a suite that never starts the oracle would be
# declaring a prerequisite it does not have.
# Pivoted query synthesis (task-2066 §4.4.4). It picks a row, builds a predicate
# every atom of which it has verified true of that row in Rust, and asserts the
# row comes back. It needs no oracle, which is the point: TLP proves the three
# partitions agree with each other, and an agreement is not a correctness - a
# comparison rule wrong the same way in all three passes it. This catches that,
# and it is the one class neither TLP nor the hand-written differential cases
# reach.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "pqs_differential"
tier = "engine"
covers = ["inillucent-sql", "inillucent-exec", "inillucent-engine"]

