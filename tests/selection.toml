# The binding guard (task-2036). It reads the record each conformance runner
# writes into `_agent_output/conformance/` and fails when a runner ran fewer
# cases than its declared capabilities allow. Before it, "all the bindings pass
# the suite" was three-fifths untrue: npm, Go and PHP each had a round trip of
# their own and read the suite not at all.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "bindings"
tier = "tooling"
covers = ["inillucent-compat"]
# It runs the npm, Go and PHP conformance runners itself now, rather than
# reading whatever records a previous run left behind (task-2066 §4.4.3), so
# what it needs is those three interpreters. A machine missing one skips with
# that interpreter named, which is what `--strict` counts.
requires = ["node", "go", "php"]

# The escape ledger's guard (task-2036). It resolves every `held_by` entry in
# `tests/escapes.toml` against the tree, so a row that claims a test holds a
# defect fails when that test is renamed or deleted, and it fails when an escape
# analysed in the design document has no row at all.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "escapes"
tier = "tooling"
covers = ["inillucent-compat"]

# The matrix guard (task-2036). It reads `crates/inillucent/tests/*.rs` and
# `crates/inillucent-compat/tests/*.rs` as text and fails when a scenario suite
# holds a test the matrix did not expand, or when `scenario!` has stopped
# expanding one of the quick arms. Every story in this repository ran at 32,768
# byte pages until it existed, which is why task-2033 - FTS5 refusing on row 42
# at SQLite's own 4,096 - was invisible to 3,169 tests.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "scenarios"
tier = "tooling"
covers = ["inillucent-compat"]

[[target]]
package = "inillucent-compat"
kind = "test"
name = "selection"
tier = "tooling"
covers = ["inillucent-compat"]
