# The wire clients, replayed against recorded transcripts of a real PostgreSQL
# 17.2 and a real MySQL 8.4.6. It declares no `requires` on purpose:
# the transcripts are checked in, so this suite runs on a fresh clone with no
# database server installed, and a green here is a real green.
[[target]]
package = "inillucent-remote"
kind = "test"
name = "protocol"
tier = "engine"

# Verified TLS against a real TLS server. It needs a Python with an
# `ssl` module and an `openssl` to generate certificates with, neither of which
# this workspace builds, so it reports success when they are absent.
[[target]]
package = "inillucent-remote"
kind = "test"
name = "transport"
tier = "e2e"
requires = ["python", "openssl"]

# The whole procedure against a running PostgreSQL, and against a running
# MySQL. Each skips with `; skipping` when its URL is unset, which is what lets
# `--strict` count the skip instead of reading it as a pass.
[[target]]
package = "inillucent-remote"
kind = "test"
name = "live_postgres"
tier = "e2e"
requires = ["postgres"]

[[target]]
package = "inillucent-remote"
kind = "test"
name = "live_mysql"
tier = "e2e"
requires = ["mysql"]

# The migration procedure itself - stage, copy, verify, publish - driven by a
# stub source rather than by a socket, so the failure paths a real server will
# not produce on request are reachable.
[[target]]
package = "inillucent-remote"
kind = "test"
name = "budget"
tier = "engine"
covers = ["inillucent-remote"]

[[target]]
package = "inillucent-remote"
kind = "test"
name = "procedure"
tier = "engine"

[[target]]
package = "inillucent-tree"
kind = "test"
name = "write_campaign"
tier = "engine"

[[target]]
package = "inillucent-vfs"
kind = "test"
name = "conformance"
