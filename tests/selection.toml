tier = "e2e"

# The same ABI, called from C rather than compared as three lists.
# It needs a C compiler, which this workspace cannot build, so it reports
# success when there is none and `--strict` is what names it.
[[target]]
package = "inillucent-driver-capi"
kind = "test"
name = "conformance"
tier = "e2e"
requires = ["cc"]

# --- perf: the cost guards, so a regression fails a test rather than a benchmark

[[target]]
package = "inillucent"
kind = "test"
name = "budget"
tier = "perf"

# --- retrieval: the embedding and retrieval engine, and its graded harness

[[target]]
package = "inillucent-bench"
kind = "bin"
name = "inillucent-bench"
tier = "retrieval"
requires = ["onnx"]

[[target]]
package = "inillucent-core"
kind = "lib"
tier = "retrieval"
requires = ["onnx"]

[[target]]
package = "inillucent-model"
kind = "lib"
tier = "retrieval"
requires = ["onnx"]

[[target]]
package = "inillucent-model"
kind = "test"
name = "campaign"
tier = "retrieval"
requires = ["onnx"]

[[target]]
package = "inillucent-model"
kind = "test"
name = "minimal"
tier = "retrieval"
requires = ["onnx"]

[[target]]
package = "inillucent-search"
kind = "lib"
tier = "retrieval"

# --- tooling: the checks that keep the repository's own rules true

[[target]]
package = "inillucent-compat"
kind = "bin"
name = "inillucent-perfhistory"
tier = "tooling"
covers = ["inillucent-compat"]

# The one command table against the two surfaces it generates. Also arrived with
# the command surface without a row.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "command_parity"
tier = "tooling"
covers = ["inillucent-cli"]

# The install command, driven as a program, with nothing downloaded. It is here
# rather than as a unit test because the defect it guards - a bare invocation
# fetching 620 MB - is about what the process does, and a function that returns
# the right value while writing half a gigabyte beside it would pass a unit test.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "setup_embeddings"
tier = "e2e"
covers = ["inillucent-cli"]

# `--root` against the file system rather than against path text.
# It drives the two shipped front ends, because the defect it guards was not in
# the check's arithmetic - it was in which file operations reached the check.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "budgets"
tier = "e2e"
covers = ["inillucent-cli"]

[[target]]
package = "inillucent-compat"
kind = "test"
name = "confinement"
tier = "e2e"
covers = ["inillucent-cli"]

# The documentation, checked against the engine beside it. Prose
# goes stale silently, which is what makes it different from code.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "documentation"
tier = "tooling"
covers = ["inillucent-compat"]

[[target]]
package = "inillucent-compat"
kind = "test"
name = "harness"
tier = "tooling"
covers = ["inillucent-compat"]

[[target]]
package = "inillucent-compat"
kind = "test"
name = "policy"
tier = "tooling"
covers = ["inillucent-compat"]

[[target]]
package = "inillucent-compat"
kind = "test"
name = "selection"
tier = "tooling"
covers = ["inillucent-compat"]
