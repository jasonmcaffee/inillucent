# It pins only its own process, and it is its own test binary, so it needs no
# `alone`: another target running beside it keeps its own mask.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "affinity"
tier = "tooling"
covers = ["inillucent-compat"]

