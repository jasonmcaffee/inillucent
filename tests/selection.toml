# Blocks crossing threads in the allocator, which is the one production crate in
# the workspace allowed to write `unsafe`. Its module comment claimed a block
# freed on a thread other than the one that allocated it "is safe", and until
# task-1932 the crate had no `tests/` directory at all - so the claim was a
# sentence rather than a fact.
[[target]]
package = "inillucent-alloc"
kind = "test"
name = "concurrency"
tier = "e2e"
covers = ["inillucent-alloc"]

# The one command table against the two surfaces it generates. Also arrived with
# the command surface without a row.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "command_parity"
tier = "tooling"
covers = ["inillucent-cli"]

# `inillucent import`, run as the verb rather than as the dot command under it.
# It is its own target because the defect it guards lived in the gap between the
# two: `.import`'s only coverage was a script that passed no options, the verb
# always passes one, and so the verb failed on every file while the suite
# underneath it stayed green.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "cli_import"
tier = "tooling"
covers = ["inillucent-cli"]

# What `inillucent batch` promises about all-or-nothing, driven through the
# shipped binary. It is an end-to-end row rather than an engine one because the
# promise is the command's: `Connection::execute_batch` is a loop of
# `execute_any` and always was, and `verbs::batch` is what wraps a transaction
# round it. Reading the result back through a second invocation is the point -
# a check inside the same process would agree with whatever that process
# believed rather than with what reached the file.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "cli_batch"
tier = "e2e"
covers = ["inillucent-cli"]

# What each command line does before it opens anything. Arrived in task-1936
# without a row, which `selection.rs` caught by name: a mistyped verb used to
# exit 0 and leave a database file named after the typo, so the defect is a file
# on disk and the test lists the directory to find it. Added here in task-1932,
# which is where the red suite surfaced.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "cli_arguments"
tier = "e2e"
covers = ["inillucent-cli"]

# The `inillucent` binary's own unit tests, which grew a `#[test]` in task-1936
# and had no row either. A binary's tests are a target like any other, and a
# target with no row is one the runner never starts.
[[target]]
package = "inillucent-cli"
kind = "bin"
name = "inillucent"
tier = "tooling"
covers = ["inillucent-cli"]

# The install command, driven as a program, with nothing downloaded. It is here
# rather than as a unit test because the defect it guards - a bare invocation
# fetching 620 MB - is about what the process does, and a function that returns
# the right value while writing half a gigabyte beside it would pass a unit test.
[[target]]
package = "inillucent-compat"
kind = "test"
name = "setup_embeddings"
tier = "e2e"
covers = ["inillucent-cli"]

# `--root` against the file system rather than against path text.
