[[symbol]]
name = "inillucent_cancel"
stability = "provisional"
since = "1.0.0"
note = "Returns UNSUPPORTED today: the engine runs a statement whole rather than a
row at a time, so there is no point at which a cancel flag could be read. It is
here so a binding can wire it once and have it begin working the day the
capability flips, which is also why it is the one provisional symbol."

