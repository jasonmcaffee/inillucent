# Every symbol the C ABI exports, and what it promises.
#
# This file is CHECKED, not documented: `tests/abi.rs` parses
# `include/inillucent_driver.h`, parses this manifest, and reads the crate's own
# `#[no_mangle]` functions, and fails on a symbol that is in any one of the
# three and not the other two. A header that declares a function nobody
# implemented is a linker error for whoever binds to it; a function exported
# with no declaration is a symbol nobody can use and nobody knows is a promise.
#
# `stability` is the promise, and it is per symbol rather than per library -
# which is the shape DuckDB v2.0 moved its C API to in August 2026, and the one
# thing from that design worth copying wholesale.
#
#   stable       the signature will not change and the symbol will not be
#                removed. A binding may rely on it.
#   provisional  it exists and may change in a minor version. A binding may
#                call it and should expect to revisit it.
#
# `since` is the ABI version the symbol appeared in, in the same
# major*1000000 + minor*1000 + patch encoding `inillucent_abi_version` returns.
#
# The test refuses a stability that has been WEAKENED - stable back to
# provisional - because that is a promise being taken back, and it should be a
# decision somebody made rather than a line somebody edited.

schema_version = 1
abi_version = "1.0.0"

[[symbol]]
name = "inillucent_abi_version"
stability = "stable"
since = "1.0.0"

