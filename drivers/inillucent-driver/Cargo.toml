[package]
name = "inillucent-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The driver: the stable surface an application uses to talk to the inillucent relational engine."

[dependencies]
# The engine, and nothing else. That single edge is the whole point of the
# crate: a consumer binds to this and is then unaffected by the
# rearchitecture's remaining deletions, which move crates underneath it.
# `inillucent-engine` re-exports the two types a caller needs to name -
# `BoundParams` and `Value` - so that this stays one edge rather than three.
inillucent-engine = { workspace = true }

[features]
# Compiles `embed(TEXT)` into the engine. Off by default: see
# `inillucent-search`. The driver forwards it so an application names one crate
# and one feature. Before this, a Rust program had to add `inillucent-engine`,
# an internal crate, beside `inillucent` for Cargo to turn the feature on.
embed = ["inillucent-engine/embed"]

[dev-dependencies]
# The one skip helper, `inillucent_base::testing::skipping`.
#
# **A dev-dependency, so the feature is on for this crate's test targets and
# off in a shipped build (task-1969, 4.6).** The skip site this crate used to
# print itself was invisible to `inillucent-testrun --strict`, which reads the
# panic rather than the phrase.
inillucent-base = { workspace = true, features = ["testing"] }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
