[package]
name = "inillucent-driver-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The C ABI over inillucent-driver: how every language that is not Rust reaches the engine."

[lib]
# The library is named for the crate rather than for the header, and that is a
# correction rather than a preference: with both named `inillucent_driver`, this
# crate's own test could not name it - the rlib collided with the
# `inillucent-driver` it depends on, and cargo reported "multiple candidates".
# Naming the artifact after the crate also means somebody looking in
# `target/debug` finds what they expected to find.
name = "inillucent_driver_capi"
# `cdylib` is what a binding loads at run time - Python's ctypes, Node's koffi,
# Go's purego, Java's FFM, C#'s DllImport. `staticlib` is for a C or C++ program
# that would rather link it. `lib` is what this crate's own tests use, because a
# test that went through the dynamic library would be testing the loader.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# The driver, and nothing else. A marshalling layer that could reach the engine
# would be a marshalling layer that could start deciding something, and then
# there would be two answers to every question in `capability.rs`.
inillucent-driver = { workspace = true }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
