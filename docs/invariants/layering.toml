# The dependency-direction contract.
#
# This file is checked, not documented: `deps.layering-is-acyclic` and its
# siblings in rustdb-compat read it, walk the workspace manifests, and fail on
# any edge that is not declared here. An architecture rule that is only written
# down is a rule that has already been broken somewhere.
#
# `kind` decides who may depend on whom. A production crate may depend only on
# production crates listed in its own `may_depend_on`. A test-only crate may
# depend inward on anything; nothing may depend outward on a test-only crate.
#
# The TDD's crate table names `rustdb-value` and `rustdb-vfs` as the two leaves.
# `rustdb-base` is a refinement made in task-1782: phase 1 needs checked
# integers, varints, checksums, page arithmetic and the error table before
# values exist, and `rustdb-vfs` needs the same error table, so they live in a
# leaf below both rather than being duplicated or forced into a crate whose own
# contents do not land until phase 2.

schema_version = 1

[[crate]]
name = "rustdb-base"
kind = "production"
layer = 0
may_depend_on = []

[[crate]]
name = "rustdb-vfs"
kind = "production"
layer = 1
may_depend_on = ["rustdb-base"]

[[crate]]
name = "rustdb-value"
kind = "production"
layer = 1
may_depend_on = ["rustdb-base"]

# `rustdb-storage` reaching into `rustdb-value` is a refinement made in
# task-1783, and it is the layering rule "storage knows pages and byte records"
# taken literally: an index cursor cannot decide which child to descend into
# without decoding the two records it is comparing, and `sqlite_schema` cannot
# be read for root pages without decoding a record. `rustdb-value` is a leaf
# below storage in the TDD's own graph, so the edge is downward and adds no
# cycle. What storage still may not reach is anything that knows what a column
# is called: no catalog, no SQL, no expressions.
[[crate]]
name = "rustdb-storage"
kind = "production"
layer = 2
may_depend_on = ["rustdb-base", "rustdb-value", "rustdb-vfs"]

# The edge from `rustdb-transaction` down to `rustdb-storage` is the one the
# TDD draws, and phase 7 had to decide which side of it the rollback journal
# falls on. The crate table puts "locks, journals, WAL, savepoints, recovery"
# here; the pager section puts the writer state machine and "journal the before
# image inside `get_page_mut`" in storage. Both are true, so the split is by
# knowledge rather than by code: `rustdb_storage::journal::Journal` is a trait
# declaring the *moments* a journal is needed - which only the pager knows -
# and this crate owns the format, the five modes, the four durability levels
# and recovery. Moving the whole commit up would have dragged the dirty set,
# the page cache and the lock ladder with it and left the pager as a
# byte-shuffling helper with no state machine, which is the opposite of what
# the TDD describes.
[[crate]]
name = "rustdb-transaction"
kind = "production"
layer = 3
may_depend_on = ["rustdb-base", "rustdb-vfs", "rustdb-storage"]

# `rustdb-sql` sitting *below* `rustdb-catalog` is a refinement made in
# task-1785. The TDD places the binder in `rustdb-sql` and says it is pure over
# an immutable catalog snapshot, and it also says the catalog parses the CREATE
# SQL stored in `sqlite_schema` with the first-party parser. Both cannot be true
# of two crates in the same direction. The parser is the more fundamental of the
# two - a catalog cannot be built without it, but a parse does not need a
# catalog - so the parser, the AST and the binder live below, and the binder is
# written against `rustdb_sql::catalog_view::CatalogView` rather than against
# the concrete snapshot. `rustdb-catalog` implements that view over what it
# reads from the file. The binder is still pure and still performs no I/O; it
# now says so in its types.
[[crate]]
name = "rustdb-sql"
kind = "production"
layer = 4
may_depend_on = ["rustdb-base", "rustdb-value"]

# The catalog reads `sqlite_schema` through the pager. Phase 7 introduces
# `rustdb-transaction` between them; until it exists, a read transaction is a
# pager read transaction, and the edge to storage is the same downward edge the
# transaction crate will later carry.
[[crate]]
name = "rustdb-catalog"
kind = "production"
layer = 5
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-storage",
  "rustdb-transaction",
  "rustdb-sql",
]

# `rustdb-ext` sitting *above* `rustdb-sql` and `rustdb-storage` is a
# refinement made in task-1789, and it is what a virtual table actually is. A
# module has to answer three questions the old position could not express: what
# schema does `CREATE VIRTUAL TABLE ... USING fts5(a, b)` declare, which needs
# the parser; what does a `MATCH` constraint cost, which needs the planner's own
# vocabulary; and where are my shadow rows, which needs a b-tree cursor. FTS5
# and R-Tree are databases inside a database - their indexes live in ordinary
# tables and are read and written a page at a time - so an extension crate that
# may not name a pager can only be a table of pure functions.
#
# The direction is still downward and still acyclic: `rustdb-ext` reads the
# front end and the storage engine, and `rustdb-vm` reads `rustdb-ext`. What it
# still may not reach is the catalog or the session; a module never resolves a
# name or opens a transaction of its own, and is handed the roots of its shadow
# tables by the host that already resolved them.
[[crate]]
name = "rustdb-ext"
kind = "production"
layer = 6
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-storage",
  "rustdb-transaction",
  "rustdb-sql",
  "rustdb-catalog",
]

[[crate]]
name = "rustdb-vm"
kind = "production"
layer = 7
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-sql",
  "rustdb-catalog",
  "rustdb-storage",
  "rustdb-transaction",
  "rustdb-ext",
]

# The edge from `rustdb-session` down to `rustdb-search` is where the retrieval
# engine becomes a first-party module, and task-1790 put it here rather than one
# layer up for a concrete reason. `Registry::with_builtins` lives in
# `rustdb-ext`, two layers below the retrieval engine, so the module cannot be
# registered there without dragging a vector index into every database that only
# wanted SQL. The connection is the first place that both builds a registry and
# is allowed to know the engine exists, which is exactly what the TDD's crate
# table says `rustdb-search` is for.
[[crate]]
name = "rustdb-session"
kind = "production"
layer = 8
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-vfs",
  "rustdb-storage",
  "rustdb-catalog",
  "rustdb-transaction",
  "rustdb-sql",
  "rustdb-ext",
  "rustdb-search",
  "rustdb-vm",
]

# The facade names `CatalogSnapshot` in one accessor and `JournalStats` and
# `PagerCounters` in two more, so it depends on the crates that define them.
# Every edge is downward and adds nothing the facade could not already reach
# through the session; naming the types is the point, because a caller that
# wants to know what a commit cost should not have to reach past the facade to
# find out.
[[crate]]
name = "rustdb"
kind = "production"
layer = 9
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-storage",
  "rustdb-catalog",
  "rustdb-session",
]

# `rustdb-migrate` is the one production crate that names both engines, and it
# has to: it reads a legacy generation directory through `rustdb-core`'s own
# reader and writes a database through the public facade. Both edges are
# downward. It is a tool rather than a library the engine uses, so nothing
# depends on it.
[[crate]]
name = "rustdb-migrate"
kind = "production"
layer = 10
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-core",
  "rustdb-search",
  "rustdb",
]

[[crate]]
name = "rustdb-capi"
kind = "production"
layer = 10
may_depend_on = ["rustdb"]

[[crate]]
name = "rustdb-cli"
kind = "production"
layer = 10
may_depend_on = ["rustdb"]

[[crate]]
name = "rustdb-core"
kind = "production"
layer = 0
may_depend_on = []

# `rustdb-search` reaching `rustdb-value` is the same refinement `rustdb-ext`
# made in task-1789 and for the same reason: a virtual-table module is handed
# `Value`s and hands them back, so it cannot be written without naming the type.
# The edge is downward to a leaf and adds no cycle.
[[crate]]
name = "rustdb-search"
kind = "production"
layer = 7
may_depend_on = ["rustdb-base", "rustdb-value", "rustdb-ext", "rustdb-core"]

[[crate]]
name = "rustdb-sim"
kind = "test-only"
layer = 11
may_depend_on = ["rustdb-base", "rustdb-vfs"]

[[crate]]
name = "rustdb-compat"
kind = "test-only"
layer = 12
may_depend_on = [
  "rustdb-base",
  "rustdb-value",
  "rustdb-storage",
  "rustdb-vfs",
  "rustdb-sim",
  "rustdb-sql",
  "rustdb-catalog",
  "rustdb-transaction",
  "rustdb-vm",
  "rustdb-session",
  "rustdb",
]

[[crate]]
name = "rustdb-bench"
kind = "test-only"
layer = 12
may_depend_on = ["rustdb-core"]

# ---------------------------------------------------------------------------
# Third-party crates a production crate may depend on, and where.
#
# Everything here is infrastructure: error plumbing, an operating-system
# boundary, or a numeric kernel. Nothing here decides database behaviour, and
# `docs/dependency-policy.md` records the argument for each one.
# ---------------------------------------------------------------------------

[[external]]
name = "libc"
category = "os-boundary"
allowed_in = ["rustdb-vfs"]

[[external]]
name = "windows-sys"
category = "os-boundary"
allowed_in = ["rustdb-vfs"]

[[external]]
name = "anyhow"
category = "error-plumbing"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "thiserror"
category = "error-plumbing"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "serde"
category = "data-plumbing"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "serde_json"
category = "data-plumbing"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "rayon"
category = "numeric-kernel"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "rust-stemmers"
category = "numeric-kernel"
allowed_in = ["rustdb-core"]

[[external]]
name = "bytemuck"
category = "numeric-kernel"
allowed_in = ["rustdb-core"]

[[external]]
name = "memmap2"
category = "os-boundary"
allowed_in = ["rustdb-core"]

[[external]]
name = "rand"
category = "numeric-kernel"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "clap"
category = "cli"
allowed_in = ["rustdb-bench"]

[[external]]
name = "postgres"
category = "benchmark-baseline"
allowed_in = ["rustdb-bench"]

[[external]]
name = "pgvector"
category = "benchmark-baseline"
allowed_in = ["rustdb-bench"]

[[external]]
name = "ort"
category = "numeric-kernel"
allowed_in = ["rustdb-core", "rustdb-bench"]

[[external]]
name = "tokenizers"
category = "numeric-kernel"
allowed_in = ["rustdb-core"]

# ---------------------------------------------------------------------------
# Crates that may never appear in a production dependency graph. These are the
# things the first-party charter forbids delegating: another database engine,
# another SQL parser, another storage or transaction layer.
# ---------------------------------------------------------------------------

[[forbidden]]
pattern = "sqlite"
reason = "SQLite is a reference and a test oracle, never a runtime component"

[[forbidden]]
pattern = "libsql"
reason = "a SQLite fork is still another engine"

[[forbidden]]
pattern = "turso"
reason = "Turso is a non-normative design reference only"

[[forbidden]]
pattern = "limbo"
reason = "Turso's engine under its former name"

[[forbidden]]
pattern = "duckdb"
reason = "another database engine"

[[forbidden]]
pattern = "sqlparser"
reason = "rust-db owns its SQL front end"

[[forbidden]]
pattern = "sqlx"
reason = "brings a driver and a parser"

[[forbidden]]
pattern = "diesel"
reason = "brings a query builder and drivers"

[[forbidden]]
pattern = "rocksdb"
reason = "another storage engine"

[[forbidden]]
pattern = "redb"
reason = "another storage engine"

[[forbidden]]
pattern = "sled"
reason = "another storage engine"

[[forbidden]]
pattern = "lmdb"
reason = "another storage engine"

[[forbidden]]
pattern = "heed"
reason = "an LMDB wrapper"

[[forbidden]]
pattern = "rusqlite"
reason = "SQLite bindings"
