# Every external project consulted while building inillucent.
#
# The register exists so that "where did this behaviour come from?" has a
# recorded answer. A normative-format entry is a specification inillucent must
# match byte for byte. A black-box-oracle entry is a program the harness runs as
# a child process and compares against. A non-normative-design-reference entry
# answered "what is worth building" and nothing else - no source was read for
# transplant, and none of these is a production dependency.
#
# `production_dependency` is false on every row and must stay false. The
# layering check enforces the same thing from the other direction.

schema_version = 1

[[reference]]
name = "SQLite database file format"
kind = "normative-format"
version = "3.53.4"
url = "https://sqlite.org/fileformat2.html"
used_by = ["inillucent-storage", "inillucent-transaction", "inillucent-base"]
production_dependency = false

[[reference]]
name = "SQLite file locking and concurrency"
kind = "normative-behaviour"
version = "3.53.4"
url = "https://sqlite.org/lockingv3.html"
used_by = ["inillucent-vfs", "inillucent-transaction"]
production_dependency = false

