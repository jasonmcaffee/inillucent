# inillucent stable error table.
#
# This file is the source of truth. crates/inillucent-base/src/error/generated.rs is
# produced from it by "cargo run -p inillucent-compat --bin inillucent-manifest -- codegen"
# and a test in inillucent-base fails if the checked-in file drifts from these rows.
#
# The columns past the numeric code record what a caller may do next, which is
# the part of the contract SQLite documents in prose rather than in a header:
#   connection_usable       - the connection may still be used after this error
#   statement_resettable    - the statement may be reset and re-stepped
#   transaction_rolled_back - the error implicitly rolled the transaction back

schema_version = 1
reference = "sqlite-3.53.4"
source = "https://sqlite.org/rescode.html"

