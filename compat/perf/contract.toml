# The performance contract: what each family is worth, and what a release has
# to reach.
#
# These weights were fixed before any measurement was taken, which is the whole
# point of them being in a file rather than in the analyser. A weighting chosen
# after the results are in is not a weighting, it is a way of writing down the
# answer you wanted.
#
# The headline is the lower bound of the bootstrap 95% interval of the weighted
# geometric mean of the paired speed ratios, SQLite over inillucent. The floor is
# the lower bound below which a required family fails the release outright,
# however good the headline is - because an engine that is twice as fast on
# average and half as fast at writing is not a faster engine, it is a differently
# shaped one, and the applications that write would be worse off.
#
# The unweighted table is published beside the weighted one, so a favourable mix
# cannot hide a slow primitive.

# task-1834 (Phase 5) raised both thresholds to the ones task-1816 sets. The
# TDD states them as replacements rather than alternatives: "**Design target**:
# weighted geomean lower 95% bound at least **3.0x**" and "**Floor**: no family
# below **1.0x** (lower bound), replacing 0.90x". They are written here rather
# than in the analyser for the same reason the weights are, and they were
# raised - a threshold that moves towards the measurement is not a threshold.
#
# The weights below are untouched and remain the ones fixed before any
# measurement was taken.
schema_version = 1
headline = "3.00"
floor = "1.00"

[[family]]
id = "open.prepare"
weight = "0.08"
required = true
description = "opening a statement: parse, bind, step one row, reset"

[[family]]
id = "read.point"
weight = "0.16"
required = true
description = "a single row by rowid, by integer key, and through a secondary index"

[[family]]
id = "read.range"
weight = "0.12"
required = true
description = "selective ranges, forward and reverse, covering and not"

[[family]]
id = "read.analytical"
weight = "0.10"
required = true
description = "full scans, aggregates, GROUP BY, DISTINCT and sorts"

[[family]]
id = "read.join"
weight = "0.08"
required = true
description = "two and four table joins, selective and not"

[[family]]
id = "write"
weight = "0.20"
required = true
description = "insert, update, delete and upsert, with and without secondary indexes"

[[family]]
id = "transaction"
weight = "0.10"
required = true
description = "autocommit, small batches, large batches and savepoints"

[[family]]
id = "schema"
weight = "0.04"
required = true
description = "creating an index, and the backfill that goes with it"

[[family]]
id = "extension"
weight = "0.08"
required = true
description = "JSON, FTS5 and the R-Tree"

[[family]]
id = "large.values"
weight = "0.04"
required = true
description = "text and blobs across the inline and overflow boundary"
