# Statements
# ---------------------------------------------------------------------------

[[production]]
name = "alter-table-stmt"
source = "https://sqlite.org/lang_altertable.html"
status = "parsed"
positive = [
  "ALTER TABLE t RENAME TO u",
  "ALTER TABLE main.t RENAME COLUMN a TO b",
  "ALTER TABLE t RENAME a TO b",
  "ALTER TABLE t ADD COLUMN c TEXT NOT NULL DEFAULT 'x'",
  "ALTER TABLE t ADD c",
  "ALTER TABLE t DROP COLUMN c",
  "ALTER TABLE t DROP c",
]
negative = ["ALTER TABLE t", "ALTER INDEX i RENAME TO j"]

