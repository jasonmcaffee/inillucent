# The SQLite parity manifest: one row per capability rust-db owes.
#
# Allowed statuses are missing, partial, pass, and intentional-deviation.
# Only pass is releasable in the default profile. A row may not claim pass
# without at least one test id, and the report generator refuses a manifest
# with a duplicate id, a source that is not in compat/sources.toml, or a
# release claim with no recorded platform result.
#
# Rows for later phases are present and missing on purpose. A capability
# that has no row cannot be reported as owed, and "we did not know we owed
# it" is exactly what a parity manifest exists to prevent.

