# ---------------------------------------------------------------------------
# The rearchitecture's re-profiled PRAGMA set, from the design's Phase 4.
#
# The TDD keeps the pragmas that mean something on the new engine and asks that
# the rest be *documented* rather than silently absent. These three rows are
# that documentation, and each one cites the test that checks it - so "the set
# was re-profiled" is a claim the suite can fail rather than a sentence in a
# design document.
#
# The split is three ways and the distinction that matters is the last two:
#
#   honoured - it does what it says;
#   fixed    - the engine has exactly one setting, the pragma reports it, and
#              any other setting is REFUSED, because accepting one it cannot
#              honour would be answering wrongly rather than answering nothing;
#   silent   - no rows and no error, which is SQLite's own answer to a pragma it
#              has never heard of, so a caller for whom the pragma was a hint
#              keeps working and the statement after it runs.
# ---------------------------------------------------------------------------

