# The pinned SQLite reference build.
#
# Every parity claim in this workspace is measured against this exact release.
# The checksums are the SHA3-256 sums SQLite publishes on its download page, and
# tools/fetch-sqlite-reference verifies a download against them before it is
# used, so an oracle run cannot silently be comparing against a different build.
#
# SQLite is a test oracle here, never a runtime component. Nothing in this file
# is read by a production crate, and the downloaded artifacts land in the
# gitignored .sqlite-ref/ directory rather than in the workspace.

schema_version = 1
version = "3.53.4"
release_id = "3530400"
download_page = "https://sqlite.org/download.html"
checksum_algorithm = "sha3-256"

# The compile-time profile the oracle is built with. It is the ordinary
# distribution profile plus the extensions the parity contract covers; a
# smaller build could measure footprint but cannot stand in for parity.
profile = "default"
compile_options = "SQLITE_ENABLE_FTS5 SQLITE_ENABLE_RTREE SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_ENABLE_COLUMN_METADATA SQLITE_ENABLE_PREUPDATE_HOOK SQLITE_ENABLE_SESSION SQLITE_THREADSAFE=1 SQLITE_ENABLE_DBSTAT_VTAB"

# The run-time settings a comparison run uses on both sides. A benchmark or a
# differential run that changes one of these has changed the experiment.
page_size = 4096
journal_mode = "delete"
synchronous = "full"
cache_size = -2000
temp_store = "file"
mmap_size = 0
foreign_keys = "on"

