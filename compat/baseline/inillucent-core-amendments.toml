# Deliberate, reviewed changes to the retrieval engine.
#
# `inillucent-baseline verify` accepts a tracked file that differs from the
# capture only when it is named here at exactly the digest it now has, so a
# second, undeclared change to the same file still fails the guard.
#
# Written by `inillucent-baseline amend`; edit through that rather than by hand.

[[amendment]]
path = "crates/inillucent-bench/Cargo.toml"
ticket = "task-1953"
reason = "task-1946 M8: inillucent-core and inillucent-base were declared here by path with no version, which cargo deny reports as error[wildcard] - a dependency that resolves to whatever is in the directory and says nothing about what a published copy would need. Both go through the workspace table now, which is where every other internal edge already is. No code and no behaviour."
sha256 = "96da8955190374e20a9de9b984d845213c944e4846fd58478ebf5fcf34fdcbf1"

[[amendment]]
path = "crates/inillucent-bench/src/arm.rs"
ticket = "embedding model head to head grading"
reason = "The grading harness was generalised from one embedding model to a head-to-head between several, matching the success criteria the design document set for that comparison. A model is now a manifest (id, width, Matryoshka widths, four prefixes, pooling, token bound, backend, output, tokenizer and weights digests) instead of a set of constants; a cache carries a header naming the corpus digest, the model, the manifest digest and the truncation it performed; grade-embedding compares two or more caches and refuses before it starts unless they agree on corpus, chunk count and query seeds; and the embedder gained CLS and last-token pooling, graph-driven inputs, and a llama.cpp backend for the one model with no ONNX export. ModelManifest::nomic_v1_5() reproduces every constant it replaced: the fresh baseline cache agrees with the August run at cosine 1.000000 minimum over 5000 chunks, and grade's card is unchanged on every measurement row."
sha256 = "3b63ebd7cc8fc9dc6f5ea383ef18ddbc7456174cc20e0d6369d4a1a651f92d4f"

