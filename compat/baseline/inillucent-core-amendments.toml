[[amendment]]
path = "crates/inillucent-core/src/vectors.rs"
ticket = "task-1876"
reason = "Vectors are filed rather than resident by default: a loaded index leaves them in vectors.bin and reads them as it scores, which took the Nikaya serving process from 3,975 MB to 2,215 MB with no measurable change in latency. VectorSet::get answers Option<&[f32]> because a filed set has no buffer to borrow from, and copy_of is what a caller that needs the values uses."
