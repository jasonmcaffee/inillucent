[[amendment]]
path = "crates/inillucent-core/src/bm25.rs"
ticket = "task-1911"
reason = "Roadmap item 10 phase 2: a size tiered merge checkpoints across several commits, and a checkpoint needs to record exactly what one fold changed rather than re-derive it later. bm25.rs gains Bm25Index::start_recording/drain_recording and LexicalDelta so a checkpoint's added postings and positions can be replayed without re-tokenising. hnsw.rs gains the graph side of the same recording (drained adjacency lists and apply_touched). index.rs adds the seam persist.rs's new segment delta format (KIND_SEGMENT_DELTA) replays through: start_recording, drain_graph_recording, drain_lexical_recording, append_store_and_vectors, apply_graph_recording, apply_lexical_recording. persist.rs adds the segment delta chain itself: a checkpoint's bytes are a pointer to whatever it continues plus only the rows that checkpoint folded, so writing the newest link never touches an earlier one, while the store and vectors replay as cheap operations and the graph and lexical index replay as recorded content rather than re-running the fold. crates/inillucent-compat/tests/segment_delta_chain.rs is the test added for it. No existing file format changes shape: KIND_STREAM is untouched."
sha256 = "e62ae829cb230651d13a6c318472b61ed60b8ffbf6234881f5c9b882d56d8bdb"

[[amendment]]
path = "crates/inillucent-core/src/distance.rs"
ticket = "task-1911"
reason = "A second distance, L2, was added to the vector index alongside cosine. Cosine remains the default: Metric::default() is Cosine, IndexConfig::default() sets metric: Metric::Cosine, and a generation saved before this field existed has no metric key in its config.bin at all, which SavedConfig::metric reads as cosine rather than refusing (a_generation_with_no_stored_metric_reads_as_cosine proves it, and an_index_declares_cosine_by_default proves the same for a table that never named a metric). No FORMAT_VERSION bump: bumping it would refuse every existing generation outright, the opposite of reading the old one as cosine. VectorSet now carries its metric and normalizes at push only for cosine, since L2 needs the raw magnitude a normalized vector would have thrown away. flat.rs::streaming_search had a real bug this surfaced: it computed 1.0 - dot(stored, query) unconditionally, which is cosine distance whatever metric the set was actually built under, so an L2 set read through the filed, unfiltered scan path was silently scored as cosine. It now calls vectors.distance_of(stored, query), which reads the set's own metric the way every other path already did; a_filed_l2_set_streams_through_the_l2_metric_not_cosine pins it."
sha256 = "21690ac3916cb680f690ec8496ea9c4ae0b04c75339c4b926f63dc957180ef7d"

