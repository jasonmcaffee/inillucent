[workspace]
resolver = "2"
members = ["crates/rustdb-core", "crates/rustdb-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
rust-stemmers = "1"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
postgres = "0.19"
pgvector = { version = "0.4", features = ["postgres"] }
# ONNX inference. `load-dynamic` loads libonnxruntime at runtime through dlopen
# rather than linking it, because ort's system linking strategy wants a static
# library and Homebrew ships only a dylib. It also avoids ort's own binary
# download, whose build script does not compile in this workspace.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "load-dynamic"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
