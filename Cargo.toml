[workspace]
resolver = "2"
members = [
    # Phase 1 foundation.
    "crates/inillucent-alloc",
    "crates/inillucent-base",
    "crates/inillucent-vfs",
    "crates/inillucent-sim",
    # Engine layers, filled in by later phases.
    "crates/inillucent-value",
    # The rearchitected engine (task-1816).
    "crates/inillucent-pool",
    "crates/inillucent-wal",
    "crates/inillucent-tree",
    "crates/inillucent-txn",
    "crates/inillucent-sqlite-reader",
    "crates/inillucent-scalar",
    "crates/inillucent-exec",
    "crates/inillucent-engine",
    "crates/inillucent-storage",
    "crates/inillucent-transaction",
    "crates/inillucent-catalog",
    "crates/inillucent-sql",
    "crates/inillucent-ext",
    "crates/inillucent",
    "crates/inillucent-cli",
    "crates/inillucent-search",
    "crates/inillucent-migrate",
    "crates/inillucent-remote",
    # Existing retrieval engine and its grading harness.
    "crates/inillucent-core",
    "crates/inillucent-bench",
    "crates/inillucent-model",
    # Test-only assurance tooling.
    "crates/inillucent-compat",
    # The driver (task-1837): the surface an application outside this workspace
    # binds to, and the C ABI every language that is not Rust reaches it
    # through. A sub project rather than two more crates in `crates/` because it
    # is the one part of the repository written to be read by somebody who is
    # not working on the engine - `drivers/README.md` is its front door.
    "drivers/inillucent-driver",
    "drivers/inillucent-driver-capi",
]

# The release profile, which is part of the fairness contract rather than a
# tuning preference.
#
# SQLite ships as an amalgamation: one translation unit, so every call in the
# engine is a candidate for inlining and every constant is visible to the
# optimiser. A Rust workspace of 29 crates compiled with the default
# sixteen codegen units and no link-time optimisation is not the same build, and
# comparing the two would be comparing build configurations rather than engines.
# Fat LTO and one codegen unit is the closest equivalent, and it is what the
# scorecard measures.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Debug and test builds keep file and line numbers and drop everything else.
#
# Measured on the 24 thread development box with rustc 1.95: a cold
# `cargo test --workspace --no-run` took 115 s with the default debuginfo, 68 s
# with `line-tables-only` and 56 s with `debug = false`. `false` was rejected
# because a panic in a crash suite with no line number is a panic somebody has
# to reproduce before they can read it. What goes is variable inspection under
# a debugger, which nobody uses on this suite. On MSVC the debuginfo lives in
# the PDB files beside the executables, so the saving is link time and the size
# of those files. `profile.test` inherits this. The release profile above is
# not affected.
[profile.dev]
debug = "line-tables-only"

# The one lint this workspace turns off, and why.
#
# **`doc_lazy_continuation` fires on the house prose style.** This repository's
# comments carry an argument rather than a description, so they are paragraphs,
# and a paragraph that uses ` - ` as a mid-sentence dash puts that dash at the
# start of a line whenever the wrap lands there. Markdown reads a line-initial
# `- ` as a list item; clippy reads it as a list item with the wrong
# indentation. Neither is what the sentence says.
#
# Nine of them were reflowed in task-1894 before this entry was written, and
# reflowing the rest would be a large prose diff that re-breaks every time
# somebody edits a paragraph - and the next person writing a comment in the
# style `AGENTS.md` asks for would add another. A real list is still checked:
# every other doc lint stays on.
[workspace.lints.clippy]
doc_lazy_continuation = "allow"

[workspace.lints.rust]
# `loom` is set by the operator with `RUSTFLAGS="--cfg loom"`, not by a Cargo
# feature, because it has to replace the atomics in every crate in the build at
# once. It lives here rather than in `inillucent-storage` because a crate cannot
# both point at this table and carry a `[lints.rust]` of its own.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.package]
version = "1.0.30"
repository = "https://github.com/Black-Rainbow-Labs/Inillucent"
readme = "README.md"
edition = "2021"
license = "MIT"
# The oldest compiler the workspace builds on, which is a different claim from
# the one `rust-toolchain.toml` makes.
#
# **The pin says what the numbers were produced with; this says what a user needs
# (task-1946, M6).** `rust-toolchain.toml` names 1.95.0 because every published
# ratio and every strict lint run came from that compiler, and a machine on
# another one is measuring something else. Neither of those facts is a reason to
# refuse a `cargo install inillucent` on an older toolchain, and without this
# line cargo has nothing to check and a user finds out from a compile error in
# somebody else's crate.
#
# Measured rather than guessed. `cargo +1.85.0 check --workspace --all-targets
# --all-features` refuses with `rustc 1.85.0 is not supported by the following
# packages: libloading@0.9.0 requires rustc 1.88.0, ort@2.0.0-rc.13 requires
# rustc 1.88`; the same command on 1.88.0 completes. So 1.88 is the floor, and
# it is a dependency's floor rather than this workspace's own - nothing written
# here needs anything newer than edition 2021 gives.
#
# Raising it is fine when something needs a newer compiler. Lowering it is a
# claim that has to be re-measured the same way, by installing that toolchain
# and running that command.
rust-version = "1.88"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# First-party crates. Every internal edge is declared here so that the layering
# test in inillucent-compat can read one table instead of walking the file system.
# ---------------------------------------------------------------------------
inillucent-alloc = { path = "crates/inillucent-alloc", version = "1.0.30" }
inillucent-base = { path = "crates/inillucent-base", version = "1.0.30" }
inillucent-vfs = { path = "crates/inillucent-vfs", version = "1.0.30" }
# **No version, deliberately.** `inillucent-sim` is `publish = false` and is a dev-dependency of
# `inillucent-pool`, `-txn` and `-wal`, which are published. Cargo strips a dev-dependency that
# carries no version requirement when it packages a crate; with one, it looks the crate up on
# crates.io and `cargo publish --workspace` stops at "no matching package named `inillucent-sim`".
inillucent-sim = { path = "crates/inillucent-sim" }
inillucent-value = { path = "crates/inillucent-value", version = "1.0.30" }
inillucent-pool = { path = "crates/inillucent-pool", version = "1.0.30" }
inillucent-wal = { path = "crates/inillucent-wal", version = "1.0.30" }
inillucent-tree = { path = "crates/inillucent-tree", version = "1.0.30" }
inillucent-txn = { path = "crates/inillucent-txn", version = "1.0.30" }
inillucent-model = { path = "crates/inillucent-model", version = "1.0.30" }
inillucent-sqlite-reader = { path = "crates/inillucent-sqlite-reader", version = "1.0.30" }
inillucent-scalar = { path = "crates/inillucent-scalar", version = "1.0.30" }
inillucent-exec = { path = "crates/inillucent-exec", version = "1.0.30" }
inillucent-engine = { path = "crates/inillucent-engine", version = "1.0.30" }
inillucent-storage = { path = "crates/inillucent-storage", version = "1.0.30" }
inillucent-transaction = { path = "crates/inillucent-transaction", version = "1.0.30" }
inillucent-catalog = { path = "crates/inillucent-catalog", version = "1.0.30" }
inillucent-sql = { path = "crates/inillucent-sql", version = "1.0.30" }
inillucent-ext = { path = "crates/inillucent-ext", version = "1.0.30" }
inillucent = { path = "crates/inillucent", version = "1.0.30" }
inillucent-core = { path = "crates/inillucent-core", version = "1.0.30" }
inillucent-cli = { path = "crates/inillucent-cli", version = "1.0.30" }
inillucent-search = { path = "crates/inillucent-search", version = "1.0.30" }
inillucent-migrate = { path = "crates/inillucent-migrate", version = "1.0.30" }
inillucent-remote = { path = "crates/inillucent-remote", version = "1.0.30" }
# **No version, for the reason `inillucent-sim` above has none.** `inillucent-compat` is
# `publish = false` and is now a dev-dependency of `inillucent`, which is published: cargo
# strips a dev-dependency with no version requirement when it packages a crate, and with one
# it would look this crate up on crates.io and stop.
inillucent-compat = { path = "crates/inillucent-compat" }
inillucent-driver = { path = "drivers/inillucent-driver", version = "1.0.30" }
inillucent-driver-capi = { path = "drivers/inillucent-driver-capi", version = "1.0.30" }

# ---------------------------------------------------------------------------
# Third-party dependencies. docs/dependency-policy.md records why each one is
# infrastructure rather than delegated database behaviour, and the dependency
# graph test refuses anything that is not listed there.
# ---------------------------------------------------------------------------
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
rust-stemmers = "1"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
postgres = "0.19"
pgvector = { version = "0.4", features = ["postgres"] }
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Security_Cryptography",
    # SSPI and SChannel, for verified TLS in `inillucent-remote` (task-1894).
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    # `SetConsoleCtrlHandler`, so Ctrl+C stops a statement rather than the
    # process (task-1932, H11).
    "Win32_System_Console",
    # `GetProcessMemoryInfo`, for the gate's memory accounting (task-1838).
    "Win32_System_ProcessStatus",
    # `SystemTimeToTzSpecificLocalTime`, for the `utc` and `localtime` date
    # modifiers (task-1979, F13).
    "Win32_System_Time",
] }
# ONNX inference. `load-dynamic` loads libonnxruntime at runtime through dlopen
# rather than linking it, because ort's system linking strategy wants a static
# library and Homebrew ships only a dylib. It also avoids ort's own binary
# download, whose build script does not compile in this workspace.
# "cuda" adds the CUDA execution provider, which is what lets a whole corpus be
# embedded on a GPU rather than on the processor. It changes no linkage: the EP is
# registered through onnxruntime.dll at run time like everything else under
# load-dynamic, so a machine without CUDA still builds and runs on the CPU.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["ndarray", "std", "load-dynamic", "cuda"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
