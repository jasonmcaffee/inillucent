[package]
name = "inillucent-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Excluded from the workspace on purpose: cargo-fuzz needs a nightly toolchain
# and libfuzzer-sys, and neither belongs in the graph the layering check walks.
# The stable toolchain still gets fuzz coverage - every target below has a
# seeded, deterministic counterpart in the crate it exercises, which runs in the
# ordinary test suite.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inillucent-base = { path = "../crates/inillucent-base" }
inillucent-vfs = { path = "../crates/inillucent-vfs" }
inillucent-pool = { path = "../crates/inillucent-pool" }
inillucent-tree = { path = "../crates/inillucent-tree" }
inillucent-wal = { path = "../crates/inillucent-wal" }

[[bin]]
name = "varint"
path = "fuzz_targets/varint.rs"
test = false
doc = false

[[bin]]
name = "bigendian"
path = "fuzz_targets/bigendian.rs"
test = false
doc = false

[[bin]]
name = "page_header"
path = "fuzz_targets/page_header.rs"
test = false
doc = false

[[bin]]
name = "leaf_page"
path = "fuzz_targets/leaf_page.rs"
test = false
doc = false

[[bin]]
name = "interior_page"
path = "fuzz_targets/interior_page.rs"
test = false
doc = false

[[bin]]
name = "meta_page"
path = "fuzz_targets/meta_page.rs"
test = false
doc = false

[[bin]]
name = "memcmp_key"
path = "fuzz_targets/memcmp_key.rs"
test = false
doc = false

[[bin]]
name = "wal_record"
path = "fuzz_targets/wal_record.rs"
test = false
doc = false
