# The fuzz targets, on a schedule.
#
# **The fuzz crate reached five crates and ran nowhere** until task-1932: no
# workflow mentioned it, so `fuzz/` was twelve targets that compiled on somebody
# desk once. This runs every one of them for a bounded time every night, and on
# demand.
#
# It is a separate workflow rather than a job in `ci.yml` for two reasons. It
# needs a **nightly** toolchain, which `cargo-fuzz` requires and which
# `rust-toolchain.toml` deliberately does not pin, and a run that finds nothing
# takes as long as its budget whatever the commit did - so it is not something a
# pull request should wait for.
#
# **A failure here is not the only thing that catches these decoders.** Every
# target has a seeded, deterministic twin in the crate it exercises -
# `fuzz_seeded` in `mysql.rs`, `postgres.rs`, `json.rs` and `store.rs`, and the
# page and varint cases in their own crates - and those run in the ordinary
# suite on the pinned stable toolchain. This workflow is what goes looking for
# the inputs nobody thought of; the twins are what stop a regression reaching
# main.

name: fuzz

on:
  schedule:
    # 03:20 UTC, which is outside the hours anybody is waiting on a run.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: how long to run each target for
        required: false
        default: "300"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The budget below is per target plus the build; two hours is room for the
    # longest budget a person can ask for through workflow_dispatch.
    timeout-minutes: 120
    strategy:
      # **Not fail-fast.** One target finding a crash says nothing about
      # whether the others would have, and cancelling them throws that away.
      fail-fast: false
      matrix:
        # Every `[[bin]]` in `fuzz/Cargo.toml`. A target added there and not
        # added here would run nowhere, which is the state this workflow exists
        # to end, so `the_fuzz_targets_are_all_scheduled` in
        # `crates/inillucent-compat/tests/policy.rs` compares the two lists.
        target:
          - varint
          - bigendian
          - page_header
          - leaf_page
          - interior_page
          - meta_page
          - memcmp_key
          - wal_record
          - mysql
          - postgres
          - json
          - store
    steps:
      - uses: actions/checkout@v4

      # `cargo-fuzz` needs nightly for `-Z sanitizer`; the workspace itself is
      # still built by the pinned stable toolchain everywhere else.
      - name: install nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly llvm-tools-preview
          rustc +nightly --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: run ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '300' }}
        # `-max_total_time` is libFuzzer's own budget, so the run ends by
        # itself rather than by the job timeout - a job the runner killed
        # reports no corpus and no coverage.
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=$SECONDS_PER_TARGET \
            -rss_limit_mb=4096 \
            -print_final_stats=1

      # A crash is only useful with the input that caused it, and the input is
      # a file the run leaves behind.
      - name: keep the artefacts a failure left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
