[package]
name = "rustdb-transaction"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Locks, autocommit, savepoints, rollback journal, WAL, checkpoints, and recovery."

[dependencies]
rustdb-base = { workspace = true }
rustdb-vfs = { workspace = true }
rustdb-storage = { workspace = true }

[dev-dependencies]
# The deterministic simulator, for fault injection. A dev-dependency, so it
# cannot reach the production graph the dependency-direction check walks - and
# it depends only on rustdb-base and rustdb-vfs, so there is no cycle back into
# this crate. Without it the two crates whose error paths matter most could not
# see an injected fault at all: every failpoint campaign in the repository ran
# from rustdb-compat, which is the wrong side of the layering to reach a
# pager or a journal directly.
rustdb-sim = { workspace = true }
