[package]
name = "inillucent-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The rearchitected engine as a database: import, catalog, DDL, pragmas, statements and virtual tables over the PAX trees."

[features]
default = []
# Passes the retrieval engine's in-process embedder through, so
# `embed(TEXT)` answers. Off by default: see `inillucent-search`.
embed = ["inillucent-search/embed"]

[dependencies]
inillucent-base = { workspace = true }
inillucent-value = { workspace = true }
inillucent-vfs = { workspace = true }
inillucent-sql = { workspace = true }
inillucent-catalog = { workspace = true }
inillucent-ext = { workspace = true }
inillucent-pool = { workspace = true }
inillucent-tree = { workspace = true }
inillucent-wal = { workspace = true }
inillucent-txn = { workspace = true }
inillucent-exec = { workspace = true }
inillucent-sqlite-reader = { workspace = true }
inillucent-search = { workspace = true }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
