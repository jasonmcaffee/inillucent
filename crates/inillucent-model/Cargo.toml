[package]
name = "inillucent-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Never published. The embedding model harness: it exists to drive a model in a
# test and a benchmark, and an application reaches embeddings through
# `inillucent-core` rather than through this.
publish = false
repository.workspace = true
description = "An executable model of the engine's transactional semantics, and the traces that drive it"

# The model depends on nothing but the error type. That is the whole point: a
# reference implementation that linked the engine could share a bug with it, and
# the two agreeing would then be evidence of nothing. The engine crates are
# dev-dependencies of the *driver*, which lives in `tests/`.
[dependencies]
inillucent-base = { workspace = true }

[dev-dependencies]
inillucent-pool = { workspace = true }
inillucent-tree = { workspace = true }
inillucent-wal = { workspace = true }
inillucent-txn = { workspace = true }
inillucent-vfs = { workspace = true }
inillucent-sim = { workspace = true }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
