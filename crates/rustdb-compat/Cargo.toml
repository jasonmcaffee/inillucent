[package]
name = "rustdb-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parity manifest, compatibility report generator, and the SQLite oracle protocol."

[dependencies]
rustdb-base = { workspace = true }
rustdb-value = { workspace = true }
rustdb-storage = { workspace = true }
rustdb-vfs = { workspace = true }
rustdb-sim = { workspace = true }
rustdb-sql = { workspace = true }
rustdb-catalog = { workspace = true }
rustdb-vm = { workspace = true }
rustdb-session = { workspace = true }
rustdb-transaction = { workspace = true }
rustdb = { workspace = true }
# The rearchitected engine (task-1816), measured beside the old one.
rustdb-tree = { workspace = true }
rustdb-sqlite-reader = { workspace = true }
rustdb-exec = { workspace = true }

[[bin]]
name = "rustdb-sqlperf"
path = "src/bin/sqlperf.rs"

[[bin]]
name = "rustdb-sizecheck"
path = "src/bin/sizecheck.rs"

[[bin]]
name = "rustdb-txnprofile"
path = "src/bin/txnprofile.rs"

[[bin]]
name = "rustdb-hotprofile"
path = "src/bin/hotprofile.rs"

[[bin]]
name = "rustdb-rawcursor"
path = "src/bin/rawcursor.rs"

[[bin]]
name = "rustdb-paxscan"
path = "src/bin/paxscan.rs"

[[bin]]
name = "rustdb-analytical"
path = "src/bin/analytical.rs"

[[bin]]
name = "rustdb-exprperf"
path = "src/bin/exprperf.rs"

[[bin]]
name = "rustdb-prepareperf"
path = "src/bin/prepareperf.rs"

[[bin]]
name = "rustdb-planperf"
path = "src/bin/planperf.rs"

[[bin]]
name = "rustdb-slt"
path = "src/bin/slt.rs"

[[bin]]
name = "rustdb-featureperf"
path = "src/bin/featureperf.rs"

[[bin]]
name = "rustdb-obligations"
path = "src/bin/obligations.rs"

[[bin]]
name = "rustdb-manifest"
path = "src/bin/manifest.rs"

[[bin]]
name = "rustdb-oracle"
path = "src/bin/oracle.rs"

[[bin]]
name = "rustdb-evidence"
path = "src/bin/evidence.rs"

[[bin]]
name = "rustdb-baseline"
path = "src/bin/baseline.rs"

[[bin]]
name = "rustdb-perf"
path = "src/bin/perf.rs"

[[bin]]
name = "rustdb-fixtures"
path = "src/bin/fixtures.rs"

[[bin]]
name = "rustdb-readperf"
path = "src/bin/readperf.rs"

[[bin]]
name = "rustdb-writeperf"
path = "src/bin/writeperf.rs"

[[bin]]
name = "rustdb-txnperf"
path = "src/bin/txnperf.rs"

[[bin]]
name = "rustdb-walperf"
path = "src/bin/walperf.rs"

[[bin]]
name = "rustdb-scorecard"
path = "src/bin/scorecard.rs"

[[bin]]
name = "rustdb-writeprofile"
path = "src/bin/writeprofile.rs"

[[bin]]
name = "rustdb-storageprofile"
path = "src/bin/storageprofile.rs"

[[bin]]
name = "rustdb-release"
path = "src/bin/release.rs"

[[bin]]
name = "rustdb-checkpointperf"
path = "src/bin/checkpointperf.rs"

[features]
# Passed through to the virtual machine so `rustdb-hotprofile` can attribute
# time and allocations to individual opcodes.
opcode-probe = [
    "rustdb-vm/opcode-probe",
    "rustdb-storage/opcode-probe",
    "rustdb-session/opcode-probe",
]
