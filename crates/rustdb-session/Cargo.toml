[package]
name = "rustdb-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Connection-local state, statement lifecycle, hooks, PRAGMA state, and interrupt handling."

[dependencies]
rustdb-base = { workspace = true }
rustdb-value = { workspace = true }
rustdb-vfs = { workspace = true }
rustdb-sql = { workspace = true }
rustdb-catalog = { workspace = true }
rustdb-vm = { workspace = true }
rustdb-storage = { workspace = true }
rustdb-transaction = { workspace = true }
rustdb-ext = { workspace = true }
rustdb-search = { workspace = true }

[features]
# Brackets the stages of preparing a statement and records them in
# `rustdb-base::probe`. Off by default and never on in a shipped build.
opcode-probe = []
