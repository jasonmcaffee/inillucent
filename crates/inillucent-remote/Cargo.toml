[package]
name = "inillucent-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Reads a running PostgreSQL or MySQL server over its own wire protocol and migrates it into an inillucent database, verified."

# **No third-party dependency, deliberately.** The alternative was the `postgres`
# crate - which is already in this workspace as a benchmark baseline - plus a
# `mysql` one. Both bring an async runtime, and this crate is linked by
# `inillucent-cli`, whose peak resident set is a published number.
[dependencies]
inillucent-base = { workspace = true }
inillucent-vfs = { workspace = true }
inillucent-tree = { workspace = true }
inillucent-engine = { workspace = true }

# The operating-system boundary, and only for TLS. See `src/tls/mod.rs` for why
# a TLS crate was not the answer, and `docs/dependency-policy.md` for the row
# these two already have.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
