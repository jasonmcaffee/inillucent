[package]
name = "rustdb-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SQLite file codec, pager, page cache, B-trees, overflow chains, freelist, and vacuum."

[dependencies]
rustdb-base = { workspace = true }
rustdb-value = { workspace = true }
rustdb-vfs = { workspace = true }

[features]
# Brackets the halves of a page edit and records them in `rustdb-base::probe`.
# Off by default and never on in a shipped build.
opcode-probe = []
