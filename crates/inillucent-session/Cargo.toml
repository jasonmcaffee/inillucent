[package]
name = "inillucent-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Connection-local state, statement lifecycle, hooks, PRAGMA state, and interrupt handling."

[dependencies]
inillucent-base = { workspace = true }
inillucent-value = { workspace = true }
inillucent-vfs = { workspace = true }
inillucent-sql = { workspace = true }
inillucent-catalog = { workspace = true }
inillucent-vm = { workspace = true }
inillucent-storage = { workspace = true }
inillucent-transaction = { workspace = true }
inillucent-ext = { workspace = true }
inillucent-search = { workspace = true }

[features]
# Brackets the stages of preparing a statement and records them in
# `inillucent-base::probe`. Off by default and never on in a shipped build.
opcode-probe = []

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
