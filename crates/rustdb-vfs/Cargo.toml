[package]
name = "rustdb-vfs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "First-party VFS contracts and the Windows, POSIX, and in-memory implementations."

[dependencies]
rustdb-base = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[[bin]]
name = "rustdb-lock-probe"
path = "src/bin/lock_probe.rs"
