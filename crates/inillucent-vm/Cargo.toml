[package]
name = "inillucent-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bytecode representation, compiler, verifier, virtual machine, cursors, and relational operators."

[dependencies]
inillucent-base = { workspace = true }
inillucent-value = { workspace = true }
inillucent-scalar = { workspace = true }
inillucent-sql = { workspace = true }
inillucent-catalog = { workspace = true }
inillucent-storage = { workspace = true }
inillucent-ext = { workspace = true }

[features]
# A build that records, per opcode, how many times it ran, how long it took and
# how many heap allocations it made. Off by default and never on in a shipped
# build: it puts a clock read and two atomic loads on the hottest path there is.
opcode-probe = []

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
