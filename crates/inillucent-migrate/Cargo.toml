[package]
name = "inillucent-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Resumable copy-and-verify migration of a legacy inillucent index directory into a inillucent database, and the legacy direct index API over one."

[dependencies]
inillucent-base = { workspace = true }
inillucent-value = { workspace = true }
inillucent-core = { workspace = true }
inillucent-search = { workspace = true }
inillucent-engine = { workspace = true }
inillucent-sqlite-reader = { workspace = true }
inillucent-tree = { workspace = true }
inillucent-catalog = { workspace = true }
# The remote sources, so `--from postgres://…` runs here too.
inillucent-remote = { workspace = true }

[dev-dependencies]
# The one skip helper, `inillucent_base::testing::skipping`.
#
# **A dev-dependency, so the feature is on for this crate's test targets and
# off in a shipped build (task-1969, 4.6).** `tests/cli.rs` cannot reach the
# compat harness - a production crate may not depend on it, even for tests -
# so the helper it calls is the one in the crate below this whole workspace.
inillucent-base = { workspace = true, features = ["testing"] }

[[bin]]
name = "inillucent-migrate"
path = "src/main.rs"

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
