[package]
name = "inillucent-transaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# **Published for the reason `inillucent-storage` is (task-1995):** `inillucent-sqlite-reader`
# depends on it and the published engine depends on that, so leaving it unpublished left the
# workspace unpublishable. Still retired with the old pager, and still here only because its
# `recovery` and `open_database` are what reads a SQLite file.
repository.workspace = true
description = "Locks, autocommit, savepoints, rollback journal, WAL, checkpoints, and recovery."

[dependencies]
inillucent-base = { workspace = true }
inillucent-vfs = { workspace = true }
inillucent-storage = { workspace = true }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
