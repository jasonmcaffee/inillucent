[features]
# Builds `inillucent-testrun`. See the comment on its `[[bin]]` section: the
# feature exists to keep the runner out of the build the runner itself starts.
testrun = []

# `opcode-probe` used to pass through to the old virtual machine so
# `inillucent-hotprofile` could attribute time and allocations to individual
# opcodes. It is gone along with `inillucent-vm` and `inillucent-session`: the
# new engine compiles to an operator tree rather than bytecode, so there is no
# per-opcode cost to attribute, and `inillucent-hotprofile`/`inillucent-txnprofile`
# no longer read `inillucent_base::probe::OPCODE_*` at all. `inillucent-storage`
# still has its own `opcode-probe` feature for the code that reads it while
# migrating a SQLite file, but nothing in this crate turns it on any more.

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
