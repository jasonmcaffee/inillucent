[package]
name = "inillucent-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
# Never published. This is the assurance harness / the benchmark arm: it links
# things that exist to measure the engine rather than to run it, and nobody
# would `cargo add` it. Saying so here is cheaper than remembering.
publish = false
repository.workspace = true
description = "Parity manifest, compatibility report generator, and the SQLite oracle protocol."

[dependencies]
inillucent-alloc = { workspace = true }
inillucent-base = { workspace = true }
inillucent-value = { workspace = true }
inillucent-storage = { workspace = true }
inillucent-vfs = { workspace = true }
inillucent-sim = { workspace = true }
inillucent-sql = { workspace = true }
inillucent-catalog = { workspace = true }
inillucent-ext = { workspace = true }
inillucent-transaction = { workspace = true }
inillucent = { workspace = true }
# The rearchitected engine.
inillucent-pool = { workspace = true }
inillucent-tree = { workspace = true }
# The engine's own JSON reader, which `inillucent-testrun` parses cargo's
# `--message-format=json` with. A test runner that pulled in a JSON crate to
# read one field would be adding a dependency this workspace already has an
# implementation of, and a stricter one: it is the reader SQLite's `json()` is
# graded against.
inillucent-scalar = { workspace = true }
inillucent-sqlite-reader = { workspace = true }
inillucent-exec = { workspace = true }
inillucent-wal = { workspace = true }
inillucent-txn = { workspace = true }
inillucent-cli = { workspace = true }
inillucent-driver = { workspace = true }
inillucent-engine = { workspace = true }
inillucent-migrate = { workspace = true }
# The gate's memory and processor accounting. The operating
# system is the only thing that can say what a *process* cost, and the
# reference arm is a separate program this workspace cannot instrument.
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# The test runner, behind a feature ON PURPOSE.
#
# Cargo builds a package's binaries whenever that package has integration tests,
# so that a test can execute one - and `inillucent-compat` has 75 of them. The
# runner's own first act is `cargo test --no-run`, which therefore tried to
# replace the executable of the process that had just asked for it. Windows does
# not allow that, and the run died with "Access is denied" on its own binary.
#
# `required-features` is cargo's own way to say "do not build this unless
# somebody asks", and it makes the conflict impossible rather than unlikely: the
# build the runner starts does not enable `testrun`, so it never touches the
# runner. Building it is one command, in `tests/inillucent-testing-tdd.md`:
#
#   cargo build -p inillucent-compat --bin inillucent-testrun --features testrun
[[bin]]
name = "inillucent-testrun"
path = "src/bin/testrun.rs"
required-features = ["testrun"]

