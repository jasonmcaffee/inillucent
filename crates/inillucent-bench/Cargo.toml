[package]
name = "inillucent-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The benchmark arm: measures this engine against SQLite, PostgreSQL and pgvector."
# Never published. It links PostgreSQL and pgvector so that the scorecard can
# measure against them; nobody would `cargo add` it, and publishing it would put
# a database client on crates.io as a dependency of a database.
publish = false

[dependencies]
# **Through the workspace table, not by path alone.** A `path` with no
# `version` is a wildcard: it resolves to whatever is in the directory and says
# nothing about what a published copy would need. Every other internal edge in
# the workspace already carries a version beside its path, and these two were the
# exception `cargo deny` found (task-1946, M8).
inillucent-core = { workspace = true, features = ["onnx"] }
inillucent-base = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
clap.workspace = true
postgres.workspace = true
pgvector.workspace = true
rand.workspace = true
# The served arm counts tokens with the model own tokenizer rather than through
# the server one text at a time; see llamacpp.rs.
tokenizers.workspace = true
