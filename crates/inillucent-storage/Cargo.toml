[package]
name = "inillucent-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# **Published, because `inillucent-engine` reaches it (task-1995).** This said "never published",
# and that was not a choice the dependency graph allowed: the engine depends on
# `inillucent-catalog` and `inillucent-sqlite-reader`, both of which depend on this, and a crate on
# crates.io cannot depend on one that is not there. Marking it unpublished made the whole workspace
# unpublishable rather than making this crate private, and the first `cargo publish --workspace`
# said so. It is still retired with the old pager and still exists only so a SQLite file can be
# read; nothing should `cargo add` it, and the description says what it is.
repository.workspace = true
description = "SQLite file codec, pager, page cache, B-trees, overflow chains, freelist, and vacuum."

[dependencies]
inillucent-base = { workspace = true }
inillucent-value = { workspace = true }
inillucent-vfs = { workspace = true }

[features]
# Brackets the halves of a page edit and records them in `inillucent-base::probe`.
# Off by default and never on in a shipped build.
opcode-probe = []
# The integrity checker in `src/check.rs`. Off by default because nothing in a
# shipped binary calls it; `inillucent-compat` asks for it, and this crate's own
# tests get it through `cfg(test)` (task-1946, M1).
check = []

[target.'cfg(loom)'.dev-dependencies]
# Only ever in a `RUSTFLAGS="--cfg loom"` build, so it cannot reach the
# production graph the dependency-direction check walks.
loom = "0.7"

# The workspace's lint table; see the note beside it in the root manifest. The
# `cfg(loom)` allowance that used to live here moved into that table, because a
# crate cannot both point at it and carry a `[lints.rust]` of its own.
[lints]
workspace = true
