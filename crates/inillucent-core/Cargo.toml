[package]
name = "inillucent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "The retrieval engine: HNSW vectors, BM25 and the hybrid ranking the SQL layer reaches through."

# **The only crate in the workspace that carried none of this**, and the one a
# reader is most likely to depend on by itself (task-1946, M6). `cargo deny`
# reported it as `unlicensed`, which is what a missing `license` means to
# anybody assembling a licence manifest from the graph.
[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
rust-stemmers.workspace = true
bytemuck.workspace = true
rand.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[features]
default = []
# Runs nomic-embed-text-v1.5 as ONNX in process. Off by default so the engine
# stays free of a native library for callers that supply their own vectors.
onnx = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
# The one skip helper, `inillucent_base::testing::skipping`.
#
# **A dev-dependency, so the feature is on for this crate's test targets and
# off in a shipped build (task-1969, 4.6).** The skip sites this crate used to
# print itself were invisible to `inillucent-testrun --strict`, which reads the
# panic rather than the phrase.
inillucent-base = { workspace = true, features = ["testing"] }
