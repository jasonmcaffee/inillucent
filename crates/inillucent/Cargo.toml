[package]
name = "inillucent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded SQL database with vector and keyword retrieval: the Rust API."

[dependencies]
inillucent-driver = { workspace = true }

# The engine's own connection surface, which four end-to-end suites here drive
# directly. They are not tests of this crate's re-export - `smoke.rs` is that -
# they are tests of the engine behind it: the budget counters, the log after a
# crash, and the edges of the statement surface the driver deliberately does not
# expose. They live here because that is where they have always lived and every
# comment in the tree that cites them cites this path.
[dev-dependencies]
# The configuration matrix and the `scenario!` macro (task-2036). Every story in
# `tests/application.rs` runs once per arm - 32,768 and 4,096 byte pages, a 64
# frame pool, two journal modes and a busy timeout - and the arms live in
# `inillucent-compat` because `inillucent-compat/tests/` runs them too. The
# layering contract names this edge in `inillucent`'s `may_test_with`: a
# production crate reaching a test-only crate even as a dev-dependency is
# refused unless it is written down.
inillucent-compat = { workspace = true }
inillucent-engine = { workspace = true }
inillucent-sql = { workspace = true }
inillucent-tree = { workspace = true }
inillucent-base = { workspace = true }

# The workspace's lint table; see the note beside it in the root manifest.
[lints]
workspace = true
